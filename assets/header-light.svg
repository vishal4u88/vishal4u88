<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="accent-glow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.08"/>
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="glow-light">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="url(#bg-light)"/>
  <rect width="1000" height="200" fill="url(#grid-light)" opacity="0.5"/>

  <!-- Glowing accent line -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#accent)" opacity="0.7"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="170" r="80" fill="url(#accent-glow-light)"/>
  <circle cx="950" cy="30" r="60" fill="url(#accent-glow-light)"/>

  <!-- Main header text -->
  <text x="500" y="80" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace" font-size="36" font-weight="700" fill="#1E293B" filter="url(#glow-light)">
    Vishal Kumar
  </text>

  <!-- Subtitle -->
  <text x="500" y="120" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace" font-size="18" font-weight="500" fill="url(#accent)">
    Data Analyst  •  AI/ML Practitioner  •  Technical Support Engineer
  </text>

  <!-- Tagline -->
  <text x="500" y="155" text-anchor="middle" font-family="'Segoe UI', 'Fira Code', monospace" font-size="13" fill="#94A3B8">
    HP Inc.  •  3+ Years  •  3 Promotions  •  Bengaluru, India
  </text>

  <!-- Decorative bottom line -->
  <rect x="350" y="175" width="300" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
</svg>
